<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Pizza Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <div class="container">
    <h1>👤 My Pizza Creations</h1>

    <!-- Selection Mode UI (Owner Only) -->
    <div id="selectionModeUI" style="display: none;">
      <div class="selection-mode-indicator">
        <i class="fas fa-check-circle"></i> Selection Mode - Select multiple pizzas to share
      </div>
      <div class="selection-actions">
        <button class="selection-btn primary" id="shareSelectedBtn">
          <i class="fas fa-share-alt"></i> Share Selected Pizzas
        </button>
        <button class="selection-btn secondary" id="cancelSelectionBtn">
          <i class="fas fa-times"></i> Cancel
        </button>
      </div>
    </div>

    <!-- View Only Mode Indicator -->
    <div id="viewOnlyIndicator" class="view-only-indicator" style="display: none;">
      <i class="fas fa-eye"></i> View Only Mode - You can view but not modify these pizzas
    </div>

    <!-- Profile Section (UNCHANGED) -->
    <div class="profile-section">
      <div class="pizzas-grid" id="userPizzasGrid">
        <!-- User's pizzas will be displayed here -->
      </div>
      
      <!-- Share Multiple Button (Owner Only) -->
      <div id="shareMultipleBtnContainer" style="text-align: center; margin-top: 20px;">
        <button class="selection-btn primary" id="shareMultipleBtn">
          <i class="fas fa-share-alt"></i> Share Multiple Pizzas
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modalsRoot"></div>

  <script src="profile.js"></script>
</body>
</html>
