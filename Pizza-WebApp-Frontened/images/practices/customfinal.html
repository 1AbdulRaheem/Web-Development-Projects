<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Customizer - Standard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body { 
      height: 100%; 
      scroll-behavior: smooth;
    }
    
    body {
      background: linear-gradient(rgba(5,5,5,0.85), rgba(10,10,10,0.85)),
                  url('https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
      color: #e7e7e7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      line-height: 1.35;
      padding-bottom: 20px;
      padding-top: 90px;
      transition: padding-top 0.3s ease;
    }

    /* CONTAINER */
    .container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 20px;
    }

    /* HEADER / NAVBAR */
    .header {
      width: 100%;
      background: rgba(20,20,20,0.98);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      -webkit-backdrop-filter: blur(15px);
      backdrop-filter: blur(15px);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateY(0);
      min-height: 90px;
      display: flex;
      align-items: center;
    }

    .header.hidden {
      transform: translateY(-100%);
    }
    
    .navbar {
      max-width: 1400px;
      margin: 0 auto;
      padding: 15px 20px;
      width: 100%;
    }

    .navbar-list {
      list-style: none;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 0;
      padding: 0;
    }

    .navbar-list li {
      display: inline-block;
    }

    /* Color Variables */
    :root {
      --accent: #ff5a2e;
      --accent-2: #ff7a4c;
      --muted: rgba(255,255,255,0.08);
      --card-bg: rgba(25,25,25,0.8);
      --card-hover: rgba(35,35,35,0.9);
      --text-primary: #ffffff;
      --text-secondary: #d6d6d6;
    }

    .navbar-list li a {
      color: var(--text-primary);
      text-decoration: none;
      background: linear-gradient(180deg, rgba(255,90,46,0.15), rgba(255,90,46,0.08));
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: 600;
      display: inline-block;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s ease;
      font-size: 0.95rem;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
      text-align: center;
      min-width: max-content;
    }

    .navbar-list li a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }

    .navbar-list li a:hover::before {
      left: 100%;
    }

    .navbar-list li a:hover, .navbar-list li a:focus {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255,90,46,0.3);
      background: linear-gradient(180deg, rgba(255,90,46,0.25), rgba(255,90,46,0.15));
      border-color: rgba(255,90,46,0.3);
    }

    /* PAGE HEADING */
    h1 {
      text-align: center;
      margin: 30px 0 40px;
      color: var(--text-primary);
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 6px 24px rgba(0,0,0,0.6);
      position: relative;
    }

    h1::after {
      content: '';
      display: block;
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 15px auto 0;
      border-radius: 2px;
    }

    /* BUTTONS CONTAINER */
    .buttons-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    /* MODE TOGGLE BUTTON */
    .mode-toggle-btn {
      padding: 15px 25px;
      background: linear-gradient(180deg, #4a90e2, #357abd);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(74, 144, 226, 0.3);
      min-width: 200px;
      justify-content: center;
    }

    .mode-toggle-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .mode-toggle-btn:hover::before {
      left: 100%;
    }

    .mode-toggle-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(74, 144, 226, 0.4);
    }

    /* PROFILE BUTTON */
    .profile-btn {
      padding: 15px 25px;
      background: linear-gradient(180deg, #9c27b0, #7b1fa2);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(156, 39, 176, 0.3);
      min-width: 150px;
      justify-content: center;
    }

    .profile-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .profile-btn:hover::before {
      left: 100%;
    }

    .profile-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(156, 39, 176, 0.4);
    }

    /* HISTORY BUTTON */
    .history-toggle-btn {
      padding: 15px 25px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(255,90,46,0.3);
      min-width: 200px;
      justify-content: center;
    }

    .history-toggle-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .history-toggle-btn:hover::before {
      left: 100%;
    }

    .history-toggle-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255,90,46,0.4);
    }

    /* HISTORY WINDOW */
    .history-window {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 25px;
      border: 1px solid var(--muted);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: all 0.4s ease;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      display: none;
    }

    .history-window.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .history-window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .history-window h2 {
      color: var(--accent);
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .history-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* SUGGESTION CARDS */
    .suggestion-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      transition: all 0.4s ease;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .suggestion-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(255,90,46,0.3);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .suggestion-card h3 { 
      color: var(--accent); 
      margin-bottom: 12px; 
      font-size: 1.3rem; 
      font-weight: 700;
    }
    
    .suggestion-card p { 
      color: var(--text-secondary); 
      margin: 8px 0; 
      font-size: 1rem; 
      line-height: 1.5;
    }
    
    .suggestion-card .price { 
      font-weight: 800; 
      color: #9fe3c0; 
      margin: 15px 0; 
      font-size: 1.3rem; 
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .suggestion-card button {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      position: relative;
      overflow: hidden;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .suggestion-card button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .suggestion-card button:hover::before {
      left: 100%;
    }

    .suggestion-card button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255,90,46,0.3);
    }

    /* CUSTOMIZER SECTION */
    .customizer-section {
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.05);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      margin-bottom: 30px;
    }

    .customizer-section h2 {
      color: var(--accent-2);
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .customizer {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: start;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .preview {
      text-align: center;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      position: sticky;
      top: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .option-group { 
      margin-bottom: 25px; 
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s ease;
    }

    .option-group:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    
    .option-group h3 {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 800;
      text-align: center;
      border-radius: 12px;
      padding: 12px;
      font-size: 1.2rem;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    label { 
      display: block; 
      color: var(--text-secondary); 
      font-weight: 700; 
      margin-bottom: 10px; 
      font-size: 1rem; 
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(10,10,10,0.6);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    select:focus { 
      box-shadow: 0 0 0 3px rgba(255,90,46,0.3); 
      border-color: var(--accent);
    }

    .toppings-list, .sauce-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .toppings-list label, .sauce-options label {
      font-weight: 600;
      background: rgba(255,255,255,0.03);
      border-radius: 50px;
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.05);
      font-size: 0.95rem;
    }

    .toppings-list label:hover, .sauce-options label:hover { 
      transform: translateY(-3px); 
      background: rgba(255,90,46,0.1); 
      border-color: rgba(255,90,46,0.3);
    }

    .toppings-list input[type="checkbox"], .sauce-options input[type="checkbox"] { 
      transform: scale(1.2); 
      accent-color: var(--accent); 
    }

    /* PIZZA IMAGE (preview) */
    .pizza-image {
      width: 280px;
      height: 280px;
      margin: 20px auto;
      border-radius: 50%;
      background: url('https://cdn-icons-png.flaticon.com/512/3595/3595455.png') center/cover no-repeat;
      display: inline-block;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.05);
      border: 8px solid rgba(255,90,46,0.2);
      transition: all 0.5s ease;
    }

    .pizza-image:hover {
      transform: rotate(5deg) scale(1.05);
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 4px 10px rgba(255,255,255,0.1);
    }

    .price-display {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 900;
      margin-top: 20px;
      color: #081f16;
      background: linear-gradient(135deg, #ffd54f, #ffca28);
      padding: 15px 25px;
      border-radius: 16px;
      display: inline-block;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      min-width: 200px;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 300px;
    }

    .price-display:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    /* Save to Profile Button */
    .save-profile-btn {
      display: block;
      margin: 15px auto 0;
      padding: 14px 20px;
      background: linear-gradient(180deg, #4CAF50, #45a049);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 300px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(76, 175, 80, 0.3);
    }

    .save-profile-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .save-profile-btn:hover::before {
      left: 100%;
    }

    .save-profile-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
      background: linear-gradient(180deg, #45a049, #3d8b40);
    }

    .confirm-btn {
      display: block;
      margin: 30px auto;
      padding: 18px 40px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .confirm-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .confirm-btn:hover::before {
      left: 100%;
    }

    .confirm-btn:hover { 
      transform: translateY(-5px) scale(1.05); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
    }
    
    .confirm-btn:active { 
      transform: translateY(0) scale(1); 
    }

    /* HIDES/UTILITY */
    .hidden { 
      display: none !important; 
    }

    /***** RESPONSIVE RULES *****/
    /* Large Desktop */
    @media (max-width: 1400px) {
      .container {
        max-width: 1200px;
      }
    }

    /* Laptop */
    @media (max-width: 1200px) {
      .customizer {
        grid-template-columns: 1fr;
        gap: 30px;
      }
      
      .preview {
        order: -1;
        position: static;
      }
    }

    /* Tablet */
    @media (max-width: 900px) {
      body {
        padding-top: 85px;
      }
      
      .header {
        min-height: 85px;
      }
      
      .container {
        padding: 15px;
      }
      
      h1 {
        font-size: 2.2rem;
      }
      
      .buttons-container {
        gap: 15px;
      }
      
      .mode-toggle-btn, .profile-btn, .history-toggle-btn {
        min-width: 160px;
        padding: 12px 20px;
        font-size: 0.95rem;
      }
      
      .options {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .toppings-list, .sauce-options {
        grid-template-columns: 1fr;
      }
      
      .history-window {
        padding: 20px;
      }
      
      .pizza-image {
        width: 220px;
        height: 220px;
      }
      
      .navbar-list {
        gap: 8px;
      }
      
      .navbar-list li a {
        padding: 10px 16px;
        font-size: 0.9rem;
      }
      
      .preview {
        padding: 20px;
      }
      
      .price-display, .save-profile-btn {
        max-width: 250px;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        padding-top: 80px;
      }
      
      .header {
        min-height: 80px;
      }
      
      .container {
        padding: 10px;
        margin: 10px auto;
      }
      
      h1 {
        font-size: 1.8rem;
        margin: 20px 0 30px;
      }
      
      .buttons-container {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      
      .mode-toggle-btn, .profile-btn, .history-toggle-btn {
        width: 100%;
        max-width: 300px;
        min-width: unset;
        padding: 12px 15px;
        font-size: 0.9rem;
      }
      
      .customizer-section, .history-window {
        padding: 20px;
        border-radius: 16px;
      }
      
      .suggestion-card {
        padding: 18px;
      }
      
      .suggestion-card h3 {
        font-size: 1.1rem;
      }
      
      .navbar-list {
        gap: 6px;
      }
      
      .navbar-list li a {
        padding: 8px 14px;
        font-size: 0.85rem;
        border-radius: 20px;
      }
      
      .pizza-image {
        width: 180px;
        height: 180px;
      }
      
      .price-display {
        font-size: 1.4rem;
        padding: 12px 20px;
        min-width: 160px;
        max-width: 220px;
      }
      
      .save-profile-btn {
        padding: 12px 16px;
        font-size: 0.9rem;
        max-width: 220px;
      }
      
      .confirm-btn {
        width: 100%;
        max-width: 300px;
        padding: 16px;
        font-size: 1rem;
      }
      
      .option-group h3 {
        font-size: 1.1rem;
        padding: 10px;
      }
      
      select {
        padding: 12px;
      }
      
      /* FIX FOR MOBILE PREVIEW POSITION */
      .customizer {
        display: flex;
        flex-direction: column;
      }
      
      .preview {
        order: 2;
        margin-top: 20px;
        width: 100%;
        align-items: center;
      }
      
      .options {
        order: 1;
      }
      
      .preview > * {
        width: 100%;
        max-width: 280px;
      }
    }

    /* Small Mobile */
    @media (max-width: 480px) {
      body {
        padding-top: 75px;
      }
      
      .header {
        min-height: 75px;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .customizer-section h2 {
        font-size: 1.4rem;
      }
      
      .history-window h2 {
        font-size: 1.2rem;
      }
      
      .suggestion-card h3 {
        font-size: 1.1rem;
      }
      
      .pizza-image {
        width: 160px;
        height: 160px;
      }
      
      .navbar-list {
        gap: 4px;
      }
      
      .navbar-list li a {
        padding: 7px 12px;
        font-size: 0.8rem;
      }
      
      .price-display {
        font-size: 1.3rem;
        padding: 10px 15px;
        max-width: 200px;
      }
      
      .save-profile-btn {
        padding: 10px 14px;
        font-size: 0.85rem;
        max-width: 200px;
      }
    }

    /* Extra Small Mobile */
    @media (max-width: 360px) {
      body {
        padding-top: 70px;
      }
      
      .header {
        min-height: 70px;
      }
      
      .navbar-list {
        gap: 3px;
      }
      
      .navbar-list li a {
        padding: 6px 10px;
        font-size: 0.75rem;
      }
      
      h1 {
        font-size: 1.4rem;
      }
      
      .navbar {
        padding: 10px 15px;
      }
      
      .pizza-image {
        width: 140px;
        height: 140px;
      }
      
      .price-display {
        font-size: 1.2rem;
        padding: 8px 12px;
        max-width: 180px;
      }
      
      .save-profile-btn {
        padding: 8px 12px;
        font-size: 0.8rem;
        max-width: 180px;
      }
    }

    /* Ensure content is properly centered when empty */
    .history-content:empty::before {
      content: "No order history yet. Place your first order!";
      color: rgba(255,255,255,0.4);
      font-style: italic;
      text-align: center;
      margin: auto;
      font-size: 1.1rem;
    }

    /* Focus styles for accessibility */
    a:focus, button:focus, select:focus, input:focus { 
      outline: 3px solid rgba(255,90,46,0.5); 
      outline-offset: 2px; 
    }
  </style>
</head>
<body>
  <div class="header" id="header">
    <nav class="navbar">
      <ul class="navbar-list">
        <li><a href="Home.html" class="link">HOME</a></li>
        <li><a href="About.html" class="link">ABOUT</a></li>
        <li><a href="Menue.html" class="link">MENU</a></li>
        <li><a href="custom.html" class="link active">CUSTOMIZE</a></li>
        <li><a href="blog.html" class="link">BLOG</a></li>
        <li><a href="sign-up.html" class="link">SIGN UP</a></li>
        <li><a href="Contact-us.html" class="link">CONTACT US</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <h1>🍕 Customize Your Perfect Pizza</h1>

    <!-- Buttons Container -->
    <div class="buttons-container">
      <button class="mode-toggle-btn" id="modeToggleBtn" onclick="window.location.href='regional.html'">
        <i class="fas fa-globe-asia"></i> Switch to Regional
      </button>
      
      <button class="profile-btn" id="profileBtn" onclick="window.location.href='profile.html'">
        <i class="fas fa-user-circle"></i> My Profile
      </button>
      
      <button class="history-toggle-btn" id="historyToggleBtn">
        <i class="fas fa-history"></i> Show Order History
      </button>
    </div>

    <!-- History Window -->
    <div class="history-window" id="historyWindow">
      <h2><i class="fas fa-history"></i> Your Order History</h2>
      <div class="history-content" id="historyContent">
        <!-- History cards will be inserted here -->
      </div>
    </div>

    <!-- Customizer Section -->
    <div class="customizer-section">
      <h2><i class="fas fa-utensils"></i> Build Your Pizza</h2>
      
      <div class="customizer">
        <div class="options">
          <div class="option-group">
            <h3>Choose Size</h3>
            <select id="size" title="choose size">
              <option value="None">Select Size</option>
              <option value="Small" data-price="129">Small - Rs.129</option>
              <option value="Medium" data-price="279">Medium - Rs.279</option>
              <option value="Large" data-price="700">Large - Rs.700</option>
              <option value="Extra Large" data-price="779">Extra Large - Rs.779</option>
            </select>
          </div>

          <div class="option-group">
            <h3>Choose Crust</h3>
            <select id="crust" title="choose crust"></select>
          </div>

          <div class="option-group">
            <h3>Choose Sauce</h3>
            <div class="sauce-options">
              <label><input type="checkbox" class="sauce-option" value="Tomato" data-price="99"> Tomato - Rs.99</label>
              <label><input type="checkbox" class="sauce-option" value="Barbeque" data-price="149"> Barbeque - Rs.149</label>
              <label><input type="checkbox" class="sauce-option" value="Pesto" data-price="169"> Pesto - Rs.169</label>
              <label><input type="checkbox" class="sauce-option" value="Chipotle" data-price="189"> Chipotle - Rs.189</label>
            </div>
          </div>

          <div class="option-group">
            <h3>Choose Toppings</h3>
            <div class="toppings-list">
              <label><input type="checkbox" value="Pepperoni" data-price="75"> Pepperoni</label>
              <label><input type="checkbox" value="Mushrooms" data-price="50"> Mushrooms</label>
              <label><input type="checkbox" value="Onions" data-price="25"> Onions</label>
              <label><input type="checkbox" value="Olives" data-price="35"> Olives</label>
              <label><input type="checkbox" value="Chicken" data-price="59"> Chicken</label>
              <label><input type="checkbox" value="Extra Cheese" data-price="90"> Extra Cheese</label>
              <label><input type="checkbox" value="Jalapeno" data-price="30"> Jalapeno</label>
              <label><input type="checkbox" value="Capcicum" data-price="40"> Capcicum</label>
            </div>
          </div>
        </div>

        <div class="preview">
          <h3>Your Pizza Preview</h3>
          <div class="pizza-image" id="pizzaImage"></div>
          <div class="price-display" id="totalPrice">Total: Rs.0</div>
          <!-- Save to Profile Button -->
          <button id="saveToProfileBtn" class="save-profile-btn">
            <i class="fas fa-save"></i> Save to Profile
          </button>
        </div>
      </div>
    </div>

    <button id="confirmBtn" class="confirm-btn">Confirm My Pizza</button>
  </div>

  <script>
    // 🌟 Smooth scroll with easing like branded websites
    function smoothScrollTo(target, duration = 400) {
      const start = window.scrollY;
      const end = target.getBoundingClientRect().top + window.scrollY;
      const distance = end - start;
      const startTime = performance.now();

      function easeInOutQuad(t) {
        return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
      }

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = easeInOutQuad(progress);
        window.scrollTo(0, start + distance * ease);
        if (elapsed < duration) requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    }

    // Data for crust options based on size
    const crusts = {
      None: [
        ["Regular", 0], 
        ["Thin Crust", 0], 
        ["Cheese Burst", 0], 
        ["Kabab Crust", 0] 
      ],
      Small: [
        ["Regular", 89],
        ["Thin Crust", 119],
        ["Cheese Burst", 149],
        ["Kabab Crust", 179]
      ],
      Medium: [
        ["Regular", 189],
        ["Thin Crust", 239],
        ["Cheese Burst", 279],
        ["Kabab Crust", 309]
      ],
      Large: [
        ["Regular", 289],
        ["Thin Crust", 349],
        ["Cheese Burst", 399],
        ["Kabab Crust", 459]
      ],
      "Extra Large": [
        ["Regular", 359],
        ["Thin Crust", 419],
        ["Cheese Burst", 499],
        ["Kabab Crust", 559]
      ]
    };

    // DOM Elements
    const sizeEl = document.getElementById('size');
    const crustEl = document.getElementById('crust');
    const sauceOptions = document.querySelectorAll('.sauce-option');
    const toppings = document.querySelectorAll('input[type=checkbox]');
    const totalPrice = document.getElementById('totalPrice');
    const confirmBtn = document.getElementById('confirmBtn');
    const pizzaImage = document.getElementById('pizzaImage');
    const historyToggleBtn = document.getElementById('historyToggleBtn');
    const historyWindow = document.getElementById('historyWindow');
    const historyContent = document.getElementById('historyContent');
    const header = document.getElementById('header');
    const saveToProfileBtn = document.getElementById('saveToProfileBtn');
    const profileBtn = document.getElementById('profileBtn');

    // User Profile Data
    let userProfile = {
      username: "Pizza Lover",
      bio: "Pizza enthusiast creating delicious combinations",
      followers: 24,
      following: false,
      pizzas: [],
      savedPizzas: [],
      badges: []
    };

    // Navbar behavior
    let lastScrollY = window.scrollY;
    let hideTimeout;
    let isScrolling;

    function handleScroll() {
      // Clear our timeout throughout the scroll
      window.clearTimeout(isScrolling);
      
      const currentScrollY = window.scrollY;
      
      // Set a timeout to run after scrolling ends
      isScrolling = setTimeout(function() {
        // At the top of page - show navbar
        if (currentScrollY <= 50) {
          header.classList.remove('hidden');
        } 
        // Scrolled down - hide navbar after 1 second
        else if (currentScrollY > lastScrollY && currentScrollY > 100) {
          hideTimeout = setTimeout(() => {
            header.classList.add('hidden');
          }, 1000);
        }
        // Scrolling up but not at top - keep navbar visible
        else if (currentScrollY < lastScrollY && currentScrollY > 100) {
          header.classList.remove('hidden');
          // Clear any pending hide timeout when scrolling up
          if (hideTimeout) {
            clearTimeout(hideTimeout);
          }
        }
        
        lastScrollY = currentScrollY;
      }, 66);
    }

    // Initialize navbar behavior
    function initNavbar() {
      // Hide navbar after 1 second on page load
      hideTimeout = setTimeout(() => {
        if (window.scrollY > 100) {
          header.classList.add('hidden');
        }
      }, 1000);
      
      // Add scroll event listener
      window.addEventListener('scroll', handleScroll, { passive: true });
    }

    // Initialize crust options based on selected size
    function setCrustOptions(size) {
      crustEl.innerHTML = '';
      (crusts[size] || crusts.Small).forEach(([val, price]) => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = `${val} - Rs.${price}`;
        opt.dataset.price = price;
        crustEl.appendChild(opt);
      });
      calculatePrice();
    }

    // Calculate total price
    function calculatePrice() {
      let total = 0;

      // Size price
      total += parseInt(sizeEl.selectedOptions[0].dataset.price || 0);

      // Crust price
      total += parseInt(crustEl.selectedOptions[0].dataset.price || 0);

      // Sauces
      sauceOptions.forEach(cb => {
        if (cb.checked) {
          total += parseInt(cb.dataset.price || 0);
        }
      });

      // Toppings
      const toppingCheckboxes = Array.from(document.querySelectorAll('input[type=checkbox]'))
        .filter(cb => !cb.classList.contains('sauce-option'));
        
      toppingCheckboxes.forEach(t => {
        if (t.checked) {
          total += parseInt(t.dataset.price || 0);
        }
      });

      totalPrice.textContent = `Total: Rs.${total}`;
      
      // Update pizza image based on toppings
      const hasExtraCheese = Array.from(toppingCheckboxes).some(t => t.checked && t.value === "Extra Cheese");
      
      if (hasExtraCheese) {
        pizzaImage.style.filter = "brightness(1.2)";
        pizzaImage.style.boxShadow = "0 0 25px gold, 0 15px 35px rgba(0,0,0,0.6)";
      } else {
        pizzaImage.style.filter = "brightness(1)";
        pizzaImage.style.boxShadow = "0 15px 35px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.05)";
      }

      return {
        size: sizeEl.value,
        crust: crustEl.value,
        sauce: Array.from(sauceOptions).filter(cb => cb.checked).map(cb => cb.value),
        toppings: Array.from(toppingCheckboxes).filter(t => t.checked).map(t => t.value),
        total: total
      };
    }

    // Save pizza configuration to localStorage
    function savePizzaConfig(pizza) {
      localStorage.setItem('lastPizzaConfig', JSON.stringify(pizza));
      
      // Also save to history (keep last 3)
      let pizzaHistory = JSON.parse(localStorage.getItem('pizzaHistory') || '[]');
      pizzaHistory.unshift({
        ...pizza,
        timestamp: new Date().toISOString()
      });
      
      // Keep only last 3 orders
      if (pizzaHistory.length > 3) {
        pizzaHistory = pizzaHistory.slice(0, 3);
      }
      
      localStorage.setItem('pizzaHistory', JSON.stringify(pizzaHistory));
    }

    // Load pizza configuration from localStorage
    function loadPizzaConfig() {
      const savedConfig = localStorage.getItem('lastPizzaConfig');
      if (savedConfig) {
        return JSON.parse(savedConfig);
      }
      return null;
    }

    // Apply a pizza configuration to the form
    function applyPizzaConfig(config) {
      // Set size
      sizeEl.value = config.size;
      setCrustOptions(config.size);
      
      // Wait for crust options to update
      setTimeout(() => {
        // Set crust
        crustEl.value = config.crust;
        
        // Set sauces
        sauceOptions.forEach(cb => {
          cb.checked = config.sauce.includes(cb.value);
        });
        
        // Set toppings
        const toppingCheckboxes = Array.from(document.querySelectorAll('input[type=checkbox]'))
          .filter(cb => !cb.classList.contains('sauce-option'));
          
        toppingCheckboxes.forEach(t => {
          t.checked = config.toppings.includes(t.value);
        });
        
        // Recalculate price
        calculatePrice();
      }, 100);
    }

    // Load user profile from localStorage
    function loadUserProfile() {
      const savedProfile = localStorage.getItem('userProfile');
      if (savedProfile) {
        userProfile = JSON.parse(savedProfile);
      }
    }

    // Save user profile to localStorage
    function saveUserProfile() {
      localStorage.setItem('userProfile', JSON.stringify(userProfile));
    }

    // Save current pizza to profile
    function savePizzaToProfile() {
      const pizzaConfig = calculatePrice();
      
      if (pizzaConfig.size === "None") {
        alert("Please select a pizza size first!");
        return;
      }
      
      const pizzaName = prompt("Give your pizza a name:", `My ${pizzaConfig.size} Pizza`);
      if (!pizzaName) return;
      
      const newPizza = {
        id: 'p' + Date.now(),
        name: pizzaName,
        size: pizzaConfig.size,
        crust: pizzaConfig.crust,
        sauce: pizzaConfig.sauce,
        toppings: pizzaConfig.toppings,
        description: `Custom ${pizzaConfig.size} pizza with ${pizzaConfig.crust} crust`,
        emoji: "🍕",
        likes: 0,
        views: 0,
        comments: [],
        savedBy: [],
        createdAt: new Date().toISOString(),
        price: pizzaConfig.total
      };
      
      userProfile.pizzas.unshift(newPizza);
      saveUserProfile();
      
      alert(`"${pizzaName}" has been saved to your profile!`);
    }

    // Function to populate history window
    function populateHistoryWindow() {
      const lastConfig = loadPizzaConfig();
      historyContent.innerHTML = '';

      if (lastConfig) {
        const historyCard = document.createElement('div');
        historyCard.className = 'suggestion-card';
        historyCard.innerHTML = `
          <h3><i class="fas fa-history"></i> Your Last Order</h3>
          <p><strong>Size:</strong> ${lastConfig.size}</p>
          <p><strong>Crust:</strong> ${lastConfig.crust}</p>
          <p><strong>Toppings:</strong> ${lastConfig.toppings.join(', ') || 'None'}</p>
          <p><strong>Sauces:</strong> ${lastConfig.sauce.join(', ') || 'None'}</p>
          <div class="price">Rs.${lastConfig.total}</div> 
        `;
        
        const button = document.createElement('button');
        button.textContent = "Order Again";
        button.addEventListener("click", () => {
          applyPizzaConfig(lastConfig);
          // Close history window after selection
          toggleHistoryWindow();
          setTimeout(() => {
            const section = document.querySelector(".preview");
            if (section) {
              smoothScrollTo(section, 400); 
            }
          }, 200); 
        });
        historyCard.appendChild(button);
        historyContent.appendChild(historyCard);
      } else {
        historyContent.innerHTML = '<p>No order history yet. Place your first order!</p>';
      }
    }

    // Toggle history window visibility
    function toggleHistoryWindow() {
      historyWindow.classList.toggle('active');
      
      if (historyWindow.classList.contains('active')) {
        historyToggleBtn.innerHTML = '<i class="fas fa-times"></i> Close History';
        populateHistoryWindow();
        // Smooth scroll to history window
        setTimeout(() => {
          smoothScrollTo(historyWindow, 400);
        }, 100);
      } else {
        historyToggleBtn.innerHTML = '<i class="fas fa-history"></i> Show Order History';
      }
    }

    // Event Listeners
    document.querySelector('.customizer').addEventListener('change', (e) => {
      const sizeEl = document.getElementById('size');

      // If size dropdown changed
      if (e.target === sizeEl) {
        const selectedSize = sizeEl.value;
        setCrustOptions(selectedSize);

        // Define multipliers
        const sizeMultiplier = {
          Small: 1,
          Medium: 1.2,
          Large: 1.4,
          "Extra Large": 1.6
        };
        const multiplier = sizeMultiplier[selectedSize] || 1;

        // Update sauce & topping prices dynamically
        document.querySelectorAll('.sauce-option, .toppings-list input[type="checkbox"]').forEach(cb => {
          // Ensure every checkbox has a base price stored
          let basePrice = parseInt(cb.getAttribute('data-base'));
          if (isNaN(basePrice)) {
            basePrice = parseInt(cb.dataset.price) || 0;
            cb.setAttribute('data-base', basePrice);
          }

          // Recalculate new price
          const newPrice = Math.round(basePrice * multiplier);
          cb.dataset.price = newPrice;

          // Update the label text (without recreating input)
          const label = cb.parentElement;
          const newText = `${cb.value} - Rs.${newPrice}`;
          label.childNodes.forEach(node => {
            if (node.nodeType === Node.TEXT_NODE) label.removeChild(node);
          });
          label.appendChild(document.createTextNode(' ' + newText));
        });

        // Recalculate after size change
        calculatePrice();
      }

      // Handle checkbox (sauce/topping) and crust changes
      if (e.target.matches('input[type="checkbox"], #crust')) {
        calculatePrice();
      }
    });

    // Save to Profile button event listener
    saveToProfileBtn.addEventListener('click', savePizzaToProfile);

    // History toggle button
    historyToggleBtn.addEventListener('click', toggleHistoryWindow);

    // Confirm button
    confirmBtn.addEventListener('click', () => {
      const pizza = calculatePrice();
      savePizzaConfig(pizza);

      alert(
        `Your Custom Pizza:\n\nSize: ${pizza.size}\nCrust: ${pizza.crust}\nSauce: ${pizza.sauce.join(', ')}\nToppings: ${pizza.toppings.join(', ')}\nTotal: Rs.${pizza.total}\n\nThank you for your order!`
      );

      // Update history window if it's open
      if (historyWindow.classList.contains('active')) {
        populateHistoryWindow();
      }
    });

    // Initialize once on page load
    window.addEventListener('DOMContentLoaded', () => {
      const sizeEl = document.getElementById('size');

      // Ensure all checkboxes have a base price
      document.querySelectorAll('.sauce-option, .toppings-list input[type="checkbox"]').forEach(cb => {
        const current = parseInt(cb.dataset.price);
        if (!cb.hasAttribute('data-base')) cb.setAttribute('data-base', current || 0);
      });

      setCrustOptions(sizeEl.value);
      calculatePrice();

      // Load user profile
      loadUserProfile();

      // Apply saved config if present
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('applyConfig')) {
        const savedConfig = loadPizzaConfig();
        if (savedConfig) applyPizzaConfig(savedConfig);
      }

      // Initialize navbar behavior
      initNavbar();
    });

    // Make functions available globally for onclick handlers
    window.applyPizzaConfig = applyPizzaConfig;
    window.smoothScrollTo = smoothScrollTo;
  </script>
</body>
