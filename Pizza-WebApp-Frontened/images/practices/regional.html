<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Customizer - Regional</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body { 
      height: 100%; 
      scroll-behavior: smooth;
    }
    
    body {
      background: linear-gradient(rgba(5,5,5,0.85), rgba(10,10,10,0.85)),
                  url('https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
      color: #e7e7e7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      line-height: 1.35;
      padding-bottom: 20px;
      padding-top: 90px;
      transition: padding-top 0.3s ease;
    }

    /* CONTAINER */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }

    /* HEADER / NAVBAR */
    .header {
      width: 100%;
      background: rgba(20,20,20,0.98);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      -webkit-backdrop-filter: blur(15px);
      backdrop-filter: blur(15px);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateY(0);
      min-height: 90px;
      display: flex;
      align-items: center;
    }

    .header.hidden {
      transform: translateY(-100%);
    }
    
    .navbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px 20px;
      width: 100%;
    }

    .navbar-list {
      list-style: none;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 0;
      padding: 0;
    }

    .navbar-list li {
      display: inline-block;
    }

    /* Color Variables */
    :root {
      --accent: #ff5a2e;
      --accent-2: #ff7a4c;
      --muted: rgba(255,255,255,0.08);
      --card-bg: rgba(25,25,25,0.8);
      --card-hover: rgba(35,35,35,0.9);
      --text-primary: #ffffff;
      --text-secondary: #d6d6d6;
    }

    .navbar-list li a {
      color: var(--text-primary);
      text-decoration: none;
      background: linear-gradient(180deg, rgba(255,90,46,0.15), rgba(255,90,46,0.08));
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: 600;
      display: inline-block;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s ease;
      font-size: 0.95rem;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
      text-align: center;
      min-width: max-content;
    }

    .navbar-list li a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }

    .navbar-list li a:hover::before {
      left: 100%;
    }

    .navbar-list li a:hover, .navbar-list li a:focus {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255,90,46,0.3);
      background: linear-gradient(180deg, rgba(255,90,46,0.25), rgba(255,90,46,0.15));
      border-color: rgba(255,90,46,0.3);
    }

    /* PAGE HEADING */
    h1 {
      text-align: center;
      margin: 30px 0 40px;
      color: var(--text-primary);
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 6px 24px rgba(0,0,0,0.6);
      position: relative;
    }

    h1::after {
      content: '';
      display: block;
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 15px auto 0;
      border-radius: 2px;
    }

    /* MODE TOGGLE BUTTON */
    .mode-toggle-container {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .mode-toggle-btn {
      padding: 15px 30px;
      background: linear-gradient(180deg, #4a90e2, #357abd);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      font-size: 1.1rem;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(74, 144, 226, 0.3);
    }

    .mode-toggle-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .mode-toggle-btn:hover::before {
      left: 100%;
    }

    .mode-toggle-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(74, 144, 226, 0.4);
    }

    /* CUSTOMIZER SECTION */
    .customizer-section {
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.05);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      margin-bottom: 30px;
    }

    .customizer-section h2 {
      color: var(--accent-2);
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .customizer {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      width: 100%;
    }

    .option-group { 
      margin-bottom: 25px; 
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s ease;
    }

    .option-group:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    
    .option-group h3 {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 800;
      text-align: center;
      border-radius: 12px;
      padding: 12px;
      font-size: 1.2rem;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    label { 
      display: block; 
      color: var(--text-secondary); 
      font-weight: 700; 
      margin-bottom: 10px; 
      font-size: 1rem; 
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(10,10,10,0.6);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    select:focus { 
      box-shadow: 0 0 0 3px rgba(255,90,46,0.3); 
      border-color: var(--accent);
    }

    .flavors-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .flavors-list label {
      font-weight: 600;
      background: rgba(255,255,255,0.03);
      border-radius: 50px;
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.05);
      font-size: 0.95rem;
    }

    .flavors-list label:hover { 
      transform: translateY(-3px); 
      background: rgba(255,90,46,0.1); 
      border-color: rgba(255,90,46,0.3);
    }

    .flavors-list input[type="radio"] { 
      transform: scale(1.2); 
      accent-color: var(--accent); 
    }

    /* PIZZA PREVIEW SECTION - ALWAYS CENTERED */
    .preview-section {
      text-align: center;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      margin: 40px auto 0;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .preview-section h3 {
      color: var(--accent);
      margin-bottom: 20px;
      font-size: 1.5rem;
      width: 100%;
      text-align: center;
    }

    .pizza-image {
      width: 280px;
      height: 280px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: url('https://cdn-icons-png.flaticon.com/512/3595/3595455.png') center/cover no-repeat;
      display: block;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.05);
      border: 8px solid rgba(255,90,46,0.2);
      transition: all 0.5s ease;
    }

    .pizza-image:hover {
      transform: rotate(5deg) scale(1.05);
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 4px 10px rgba(255,255,255,0.1);
    }

    .price-display {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 900;
      margin-top: 20px;
      color: #081f16;
      background: linear-gradient(135deg, #ffd54f, #ffca28);
      padding: 15px 25px;
      border-radius: 16px;
      display: block;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      min-width: 200px;
      transition: all 0.3s ease;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .price-display:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    .confirm-btn {
      display: block;
      margin: 30px auto;
      padding: 18px 40px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .confirm-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .confirm-btn:hover::before {
      left: 100%;
    }

    .confirm-btn:hover { 
      transform: translateY(-5px) scale(1.05); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
    }
    
    .confirm-btn:active { 
      transform: translateY(0) scale(1); 
    }

    /* HIDES/UTILITY */
    .hidden { 
      display: none !important; 
    }

    /***** RESPONSIVE RULES *****/
    /* Laptop */
    @media (max-width: 1200px) {
      .container {
        max-width: 1000px;
      }
    }

    /* Tablet */
    @media (max-width: 900px) {
      body {
        padding-top: 85px;
      }
      
      .header {
        min-height: 85px;
      }
      
      .container {
        padding: 15px;
      }
      
      h1 {
        font-size: 2.2rem;
      }
      
      .options {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .flavors-list {
        grid-template-columns: 1fr;
      }
      
      .pizza-image {
        width: 220px;
        height: 220px;
      }
      
      .navbar-list {
        gap: 8px;
      }
      
      .navbar-list li a {
        padding: 10px 16px;
        font-size: 0.9rem;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        padding-top: 80px;
      }
      
      .header {
        min-height: 80px;
      }
      
      .container {
        padding: 10px;
        margin: 10px auto;
      }
      
      h1 {
        font-size: 1.8rem;
        margin: 20px 0 30px;
      }
      
      .customizer-section {
        padding: 20px;
        border-radius: 16px;
      }
      
      .navbar-list {
        gap: 6px;
      }
      
      .navbar-list li a {
        padding: 8px 14px;
        font-size: 0.85rem;
        border-radius: 20px;
      }
      
      .pizza-image {
        width: 180px;
        height: 180px;
      }
      
      .price-display {
        font-size: 1.4rem;
        padding: 12px 20px;
        min-width: 160px;
      }
      
      .confirm-btn {
        width: 90%;
        padding: 16px;
        font-size: 1.1rem;
      }
      
      .option-group h3 {
        font-size: 1.1rem;
        padding: 10px;
      }
      
      select {
        padding: 12px;
      }
      
      .mode-toggle-btn {
        padding: 12px 20px;
        font-size: 1rem;
      }
    }

    /* Small Mobile */
    @media (max-width: 480px) {
      body {
        padding-top: 75px;
      }
      
      .header {
        min-height: 75px;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .customizer-section h2 {
        font-size: 1.4rem;
      }
      
      .pizza-image {
        width: 160px;
        height: 160px;
      }
      
      .navbar-list {
        gap: 4px;
      }
      
      .navbar-list li a {
        padding: 7px 12px;
        font-size: 0.8rem;
      }
    }

    /* Extra Small Mobile */
    @media (max-width: 360px) {
      body {
        padding-top: 70px;
      }
      
      .header {
        min-height: 70px;
      }
      
      .navbar-list {
        gap: 3px;
      }
      
      .navbar-list li a {
        padding: 6px 10px;
        font-size: 0.75rem;
      }
      
      h1 {
        font-size: 1.4rem;
      }
      
      .navbar {
        padding: 10px 15px;
      }
    }

    /* Focus styles for accessibility */
    a:focus, button:focus, select:focus, input:focus { 
      outline: 3px solid rgba(255,90,46,0.5); 
      outline-offset: 2px; 
    }
  </style>
</head>
<body>
  <div class="header" id="header">
    <nav class="navbar">
      <ul class="navbar-list">
        <li><a href="Home.html" class="link">HOME</a></li>
        <li><a href="About.html" class="link">ABOUT</a></li>
        <li><a href="Menue.html" class="link">MENU</a></li>
        <li><a href="regional.html" class="link active">CUSTOMIZE</a></li>
        <li><a href="blog.html" class="link">BLOG</a></li>
        <li><a href="sign-up.html" class="link">SIGN UP</a></li>
        <li><a href="Contact-us.html" class="link">CONTACT US</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <h1>🍕 Regional Pizza Customizer</h1>

    <!-- Mode Toggle Button -->
    <div class="mode-toggle-container">
      <button class="mode-toggle-btn" id="modeToggleBtn" onclick="window.location.href='customfinal.html'">
        <i class="fas fa-pizza-slice"></i> Switch to Standard Mode
      </button>
    </div>

    <!-- Customizer Section -->
    <div class="customizer-section">
      <h2><i class="fas fa-utensils"></i> Build Your Regional Pizza</h2>
      
      <div class="customizer">
        <div class="options">
          <!-- Size Option -->
          <div class="option-group">
            <h3>Choose Size</h3>
            <select id="size" title="choose size">
              <option value="None">Select Size</option>
              <option value="Small" data-price="129">Small - Rs.129</option>
              <option value="Medium" data-price="279">Medium - Rs.279</option>
              <option value="Large" data-price="700">Large - Rs.700</option>
              <option value="Extra Large" data-price="779">Extra Large - Rs.779</option>
            </select>
          </div>

          <!-- Crust Option -->
          <div class="option-group">
            <h3>Choose Crust</h3>
            <select id="crust" title="choose crust"></select>
          </div>

          <!-- City Option -->
          <div class="option-group">
            <h3>Choose Your City</h3>
            <select id="city" title="choose city">
              <option value="None">Select Your City</option>
              <option value="Lahore">Lahore</option>
              <option value="Karachi">Karachi</option>
              <option value="Islamabad">Islamabad</option>
              <option value="Multan">Multan</option>
            </select>
          </div>

          <!-- City-specific flavors will appear here -->
          <div class="option-group hidden" id="flavor-group">
            <h3>City Special Flavors</h3>
            <div class="flavors-list" id="flavors-list">
              <!-- Dynamic flavors will be inserted here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pizza Preview Section at the end - ALWAYS CENTERED -->
    <div class="preview-section">
      <h3>Your Pizza Preview</h3>
      <div class="pizza-image" id="pizzaImage"></div>
      <div class="price-display" id="totalPrice">Total: Rs.0</div>
    </div>

    <button id="confirmBtn" class="confirm-btn">Confirm My Pizza</button>
  </div>

  <script>
    // Data for crust options based on size
    const crusts = {
      None: [
        ["Regular", 0], 
        ["Thin Crust", 0], 
        ["Cheese Burst", 0], 
        ["Kabab Crust", 0] 
      ],
      Small: [
        ["Regular", 89],
        ["Thin Crust", 119],
        ["Cheese Burst", 149],
        ["Kabab Crust", 179]
      ],
      Medium: [
        ["Regular", 189],
        ["Thin Crust", 239],
        ["Cheese Burst", 279],
        ["Kabab Crust", 309]
      ],
      Large: [
        ["Regular", 289],
        ["Thin Crust", 349],
        ["Cheese Burst", 399],
        ["Kabab Crust", 459]
      ],
      "Extra Large": [
        ["Regular", 359],
        ["Thin Crust", 419],
        ["Cheese Burst", 499],
        ["Kabab Crust", 559]
      ]
    };

    // City-specific flavors with base prices (for Small size)
    const cityFlavors = {
      Lahore: [
        { name: "Lahori Tikka", basePrice: 150 },
        { name: "Chicken Fajita", basePrice: 120 }
      ],
      Karachi: [
        { name: "Seafood Special", basePrice: 180 },
        { name: "Spicy Beef", basePrice: 160 }
      ],
      Islamabad: [
        { name: "Capital Delight", basePrice: 140 },
        { name: "Chicken Supreme", basePrice: 130 }
      ],
      Multan: [
        { name: "Sohan Halwa Special", basePrice: 200 },
        { name: "Mutton Karahi", basePrice: 170 }
      ]
    };

    // Size multipliers for flavor prices
    const sizeMultiplier = {
      Small: 1,
      Medium: 1.2,
      Large: 1.4,
      "Extra Large": 1.6
    };

    // DOM Elements
    const cityEl = document.getElementById('city');
    const sizeEl = document.getElementById('size');
    const crustEl = document.getElementById('crust');
    const flavorGroup = document.getElementById('flavor-group');
    const flavorsList = document.getElementById('flavors-list');
    const totalPrice = document.getElementById('totalPrice');
    const confirmBtn = document.getElementById('confirmBtn');
    const pizzaImage = document.getElementById('pizzaImage');
    const header = document.getElementById('header');

    // Navbar behavior
    let lastScrollY = window.scrollY;
    let hideTimeout;
    let isScrolling;

    function handleScroll() {
      // Clear our timeout throughout the scroll
      window.clearTimeout(isScrolling);
      
      const currentScrollY = window.scrollY;
      
      // Set a timeout to run after scrolling ends
      isScrolling = setTimeout(function() {
        // At the top of page - show navbar
        if (currentScrollY <= 50) {
          header.classList.remove('hidden');
        } 
        // Scrolled down - hide navbar after 1 second
        else if (currentScrollY > lastScrollY && currentScrollY > 100) {
          hideTimeout = setTimeout(() => {
            header.classList.add('hidden');
          }, 1000);
        }
        // Scrolling up but not at top - keep navbar visible
        else if (currentScrollY < lastScrollY && currentScrollY > 100) {
          header.classList.remove('hidden');
          // Clear any pending hide timeout when scrolling up
          if (hideTimeout) {
            clearTimeout(hideTimeout);
          }
        }
        
        lastScrollY = currentScrollY;
      }, 66);
    }

    // Initialize navbar behavior
    function initNavbar() {
      // Hide navbar after 1 second on page load
      hideTimeout = setTimeout(() => {
        if (window.scrollY > 100) {
          header.classList.add('hidden');
        }
      }, 1000);
      
      // Add scroll event listener
      window.addEventListener('scroll', handleScroll, { passive: true });
    }

    // Initialize crust options based on selected size
    function setCrustOptions(size) {
      crustEl.innerHTML = '';
      (crusts[size] || crusts.Small).forEach(([val, price]) => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = `${val} - Rs.${price}`;
        opt.dataset.price = price;
        crustEl.appendChild(opt);
      });
      calculatePrice();
    }

    // Set city-specific flavors with dynamic pricing based on size
    function setCityFlavors(city, size) {
      flavorsList.innerHTML = '';
      
      if (city === "None") {
        flavorGroup.classList.add('hidden');
        return;
      }
      
      const flavors = cityFlavors[city];
      if (flavors) {
        const multiplier = sizeMultiplier[size] || 1;
        
        flavors.forEach(flavor => {
          const calculatedPrice = Math.round(flavor.basePrice * multiplier);
          const label = document.createElement('label');
          label.innerHTML = `
            <input type="radio" name="flavor" value="${flavor.name}" data-base-price="${flavor.basePrice}" data-price="${calculatedPrice}">
            ${flavor.name} - Rs.${calculatedPrice}
          `;
          flavorsList.appendChild(label);
        });
        flavorGroup.classList.remove('hidden');
      }
      
      calculatePrice();
    }

    // Update flavor prices when size changes
    function updateFlavorPrices(size) {
      const multiplier = sizeMultiplier[size] || 1;
      const flavorRadios = document.querySelectorAll('input[name="flavor"]');
      
      flavorRadios.forEach(radio => {
        const basePrice = parseInt(radio.dataset.basePrice);
        const newPrice = Math.round(basePrice * multiplier);
        radio.dataset.price = newPrice;
        
        // Update the label text
        const label = radio.parentElement;
        const newText = `${radio.value} - Rs.${newPrice}`;
        // Remove existing text nodes
        Array.from(label.childNodes).forEach(node => {
          if (node.nodeType === Node.TEXT_NODE) {
            label.removeChild(node);
          }
        });
        // Add new text after the input
        label.appendChild(document.createTextNode(' ' + newText));
      });
      
      calculatePrice();
    }

    // Calculate total price
    function calculatePrice() {
      let total = 0;

      // Size price
      total += parseInt(sizeEl.selectedOptions[0].dataset.price || 0);

      // Crust price
      total += parseInt(crustEl.selectedOptions[0].dataset.price || 0);

      // Selected flavor price
      const selectedFlavor = document.querySelector('input[name="flavor"]:checked');
      if (selectedFlavor) {
        total += parseInt(selectedFlavor.dataset.price || 0);
      }

      totalPrice.textContent = `Total: Rs.${total}`;
      
      // Update pizza image based on selection
      updatePizzaImage();
      
      return {
        city: cityEl.value,
        size: sizeEl.value,
        crust: crustEl.value,
        flavor: selectedFlavor ? selectedFlavor.value : "None",
        total: total
      };
    }

    // Update pizza image based on selections
    function updatePizzaImage() {
      const size = sizeEl.value;
      const crust = crustEl.value;
      const flavor = document.querySelector('input[name="flavor"]:checked');
      
      // Change border color based on crust
      if (crust.includes("Cheese")) {
        pizzaImage.style.borderColor = "rgba(255,215,0,0.4)";
      } else if (crust.includes("Kabab")) {
        pizzaImage.style.borderColor = "rgba(139,69,19,0.4)";
      } else {
        pizzaImage.style.borderColor = "rgba(255,90,46,0.2)";
      }
    }

    // Event Listeners
    sizeEl.addEventListener('change', (e) => {
      setCrustOptions(e.target.value);
      updateFlavorPrices(e.target.value);
    });

    crustEl.addEventListener('change', calculatePrice);

    cityEl.addEventListener('change', (e) => {
      setCityFlavors(e.target.value, sizeEl.value);
    });

    document.addEventListener('change', (e) => {
      if (e.target.matches('input[name="flavor"]')) {
        calculatePrice();
      }
    });

    // Confirm button
    confirmBtn.addEventListener('click', () => {
      const pizza = calculatePrice();
      
      if (pizza.city === "None" || pizza.size === "None") {
        alert("Please select your city and pizza size before confirming!");
        return;
      }
      
      let message = `Your Regional Pizza:\n\nCity: ${pizza.city}\nSize: ${pizza.size}\nCrust: ${pizza.crust}`;
      
      if (pizza.flavor !== "None") {
        message += `\nFlavor: ${pizza.flavor}`;
      }
      
      message += `\nTotal: Rs.${pizza.total}\n\nThank you for your order!`;
      
      alert(message);
    });

    // Initialize once on page load
    window.addEventListener('DOMContentLoaded', () => {
      setCrustOptions(sizeEl.value);
      setCityFlavors(cityEl.value, sizeEl.value);
      calculatePrice();
      initNavbar();
    });
  </script>
</body>
</html>
