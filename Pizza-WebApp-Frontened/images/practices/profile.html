<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Pizza Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      background: linear-gradient(rgba(5,5,5,0.85), rgba(10,10,10,0.85)),
                  url('https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
      color: #e7e7e7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding-bottom: 20px;
    }

    /* Header */
    .header {
      width: 100%;
      background: rgba(15,15,15,0.85);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }  
    
    .navbar {
      max-width: 1400px;
      margin: 0 auto;
      padding: 8px 20px;
    }

    .navbar-list {
      list-style: none;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
      flex-wrap: wrap;
    }

    .navbar-list li a {
      color: white;
      text-decoration: none;
      background: rgba(255,90,46,0.15);
      padding: 12px 20px;
      border-radius: 50px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .navbar-list li a:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(255,90,46,0.2);
      background: rgba(255,90,46,0.25);
    }

    .nav-active {
      background: rgba(255,90,46,0.35) !important;
      box-shadow: 0 6px 18px rgba(255,90,46,0.3) !important;
    }

    /* Main container */
    .container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 30px 0 40px;
      color: white;
      font-size: 2.8rem;
      font-weight: 800;
    }

    h1::after {
      content: '';
      display: block;
      width: 100px;
      height: 4px;
      background: #ff5a2e;
      margin: 15px auto 0;
      border-radius: 2px;
    }

    /* Profile section */
    .profile-section {
      background: rgba(25,25,25,0.8);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .profile-section h2 {
      color: #ff7a4c;
      margin-bottom: 25px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
    }

    /* Selection mode styles */
    .selection-mode-indicator {
      background: rgba(32, 201, 151, 0.2);
      border: 1px solid rgba(32, 201, 151, 0.3);
      color: #20c997;
      padding: 10px 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .selection-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .selection-btn {
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      font-size: 14px;
    }

    .selection-btn.primary {
      background: linear-gradient(180deg, #ff5a2e, #ff7a4c);
      color: white;
    }

    .selection-btn.secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .selection-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* Pizza grid */
    .pizzas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .pizza-card {
      background: rgba(25,25,25,0.8);
      border-radius: 16px;
      padding: 25px 20px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: all 0.4s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      aspect-ratio: 1;
      position: relative;
    }

    .pizza-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff5a2e, #ff7a4c);
    }

    .pizza-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      background: rgba(35,35,35,0.9);
    }

    .pizza-card.selected {
      border: 2px solid #20c997;
      box-shadow: 0 0 0 2px rgba(32, 201, 151, 0.3), 0 10px 30px rgba(0,0,0,0.3);
    }

    .pizza-emoji {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .pizza-name {
      font-size: 18px;
      font-weight: 700;
      color: white;
      margin-bottom: 10px;
    }

    .pizza-share-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #d6d6d6;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 5px;
    }

    .pizza-share-btn:hover {
      background: rgba(255,90,46,0.2);
      color: white;
    }

    .selection-checkbox {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(25,25,25,0.8);
      border: 2px solid rgba(255,255,255,0.3);
      display: none;
    }

    .selection-mode .selection-checkbox {
      display: block;
    }

    .selection-mode .pizza-card {
      cursor: default;
    }

    .selection-mode .pizza-card.selected .selection-checkbox {
      background: #20c997;
      border-color: #20c997;
    }

    .selection-mode .pizza-card.selected .selection-checkbox::after {
      content: '✓';
      color: white;
      font-size: 12px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* View only mode indicator */
    .view-only-indicator {
      background: rgba(255, 193, 7, 0.2);
      border: 1px solid rgba(255, 193, 7, 0.3);
      color: #ffc107;
      padding: 10px 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: all;
    }

    .instagram-modal {
      background: rgba(25,25,25,0.8);
      border-radius: 12px;
      width: 90%;
      max-width: 900px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .modal-backdrop.active .instagram-modal {
      transform: scale(1);
    }

    .modal-image-section {
      flex: 1;
      background: rgba(20,20,20,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .modal-image-content {
      font-size: 120px;
      text-align: center;
    }

    .modal-details-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 400px;
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff5a2e, #ff7a4c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .modal-username {
      font-weight: 700;
      font-size: 14px;
    }

    .modal-close {
      margin-left: auto;
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .modal-pizza-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .modal-pizza-details {
      margin-bottom: 16px;
    }

    .modal-pizza-detail {
      margin-bottom: 8px;
      color: #d6d6d6;
    }

    .modal-pizza-description {
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-pizza-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .modal-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #ff5a2e;
    }

    .modal-stat-label {
      font-size: 12px;
      color: #d6d6d6;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .modal-action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.05);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .modal-action-btn:hover {
      background: rgba(255,90,46,0.2);
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.15) inset;
    }

    .modal-action-btn.primary {
      background: linear-gradient(180deg, #ff5a2e, #ff7a4c);
      color: white;
      transition: 0.2s ease;
    }

    .modal-action-btn.primary:hover {
      background: linear-gradient(180deg, #ff7a4c, #ff5a2e);
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.15) inset;
    }

    .modal-action-btn.delete {
      background: rgba(220, 53, 69, 0.2);
      color: #dc3545;
      transition: 0.2s ease;
    }

    .modal-action-btn.delete:hover {
      background: #dc3545;
      color: white;
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.15) inset;
    }

    .modal-action-btn.download {
      background-color: greenyellow;
      color: black;
      transition: 0.2s ease;
    }

    .modal-action-btn.download:hover {
       background: green;
       transform: translateY(2px);
       box-shadow: 0 2px 5px rgba(0,0,0,0.15) inset;
    }

    .modal-action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .modal-action-btn:disabled:hover {
      background: rgba(255,255,255,0.05);
      transform: none !important;
      box-shadow: none !important;
    }

    /* RESPONSIVE DESIGN - FIXED */
    /* Tablet */
    @media (max-width: 900px) {
      .container {
        padding: 15px;
      }
      
      h1 {
        font-size: 2.2rem;
      }
      
      .profile-section {
        padding: 25px;
        border-radius: 16px;
      }
      
      .pizzas-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }
      
      .pizza-card {
        padding: 20px 15px;
      }
      
      .pizza-emoji {
        font-size: 45px;
      }
      
      .navbar-list li a {
        padding: 10px 16px;
        font-size: 0.9rem;
      }
      
      /* Modal Responsive */
      .instagram-modal {
        flex-direction: column;
        max-width: 500px;
      }
      
      .modal-image-section {
        padding: 30px;
      }
      
      .modal-image-content {
        font-size: 80px;
      }
      
      .modal-details-section {
        max-width: 100%;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .container {
        padding: 10px;
        margin: 10px auto;
      }
      
      h1 {
        font-size: 1.8rem;
        margin: 20px 0 30px;
      }
      
      .profile-section {
        padding: 20px;
        border-radius: 14px;
      }
      
      .pizzas-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 14px;
      }
      
      .pizza-card {
        padding: 18px 12px;
      }
      
      .pizza-emoji {
        font-size: 40px;
      }
      
      .pizza-name {
        font-size: 16px;
      }
      
      .navbar-list {
        gap: 8px;
      }
      
      .navbar-list li a {
        padding: 8px 14px;
        font-size: 0.85rem;
      }
      
      /* Modal Mobile */
      .instagram-modal {
        width: 95%;
        max-height: 85vh;
      }
      
      .modal-image-section {
        padding: 20px;
      }
      
      .modal-image-content {
        font-size: 60px;
      }
    }

    /* Small Mobile */
    @media (max-width: 400px) {
      h1 {
        font-size: 1.6rem;
      }
      
      .profile-section h2 {
        font-size: 1.4rem;
      }
      
      .pizzas-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
      }
      
      .pizza-card {
        padding: 15px 10px;
      }
      
      .pizza-emoji {
        font-size: 35px;
      }
      
      .pizza-name {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <nav class="navbar">
      <ul class="navbar-list">
        <li><a href="Home.html">HOME</a></li>
        <li><a href="About.html">ABOUT</a></li>
        <li><a href="Menue.html">MENU</a></li>
        <li><a href="custom.html">CUSTOMIZE</a></li>
        <li><a href="blog.html">BLOG</a></li>
        <li><a href="profile.html" class="nav-active">PROFILE</a></li>
        <li><a href="sign-up.html">SIGN UP</a></li>
        <li><a href="Contact-us.html">CONTACT US</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <h1>👤 My Pizza Creations</h1>

    <!-- Selection Mode UI (Owner Only) -->
    <div id="selectionModeUI" style="display: none;">
      <div class="selection-mode-indicator">
        <i class="fas fa-check-circle"></i> Selection Mode - Select multiple pizzas to share
      </div>
      <div class="selection-actions">
        <button class="selection-btn primary" id="shareSelectedBtn">
          <i class="fas fa-share-alt"></i> Share Selected Pizzas
        </button>
        <button class="selection-btn secondary" id="cancelSelectionBtn">
          <i class="fas fa-times"></i> Cancel
        </button>
      </div>
    </div>

    <!-- View Only Mode Indicator -->
    <div id="viewOnlyIndicator" class="view-only-indicator" style="display: none;">
      <i class="fas fa-eye"></i> View Only Mode - You can view but not modify these pizzas
    </div>

    <!-- Profile Section -->
    <div class="profile-section">
      <div class="pizzas-grid" id="userPizzasGrid">
        <!-- User's pizzas will be displayed here -->
      </div>
      
      <!-- Share Multiple Button (Owner Only) -->
      <div id="shareMultipleBtnContainer" style="text-align: center; margin-top: 20px;">
        <button class="selection-btn primary" id="shareMultipleBtn">
          <i class="fas fa-share-alt"></i> Share Multiple Pizzas
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modalsRoot"></div>

  <script>
    // User Profile Data
    let userProfile = {
      username: "Pizza Lover",
      bio: "Pizza enthusiast creating delicious combinations",
      followers: 24,
      pizzas: [
        {
          id: "1",
          name: "Spicy Pepperoni",
          size: "Large",
          crust: "Thin",
          toppings: ["Pepperoni", "Jalapenos", "Mushrooms"],
          sauce: ["Tomato"],
          description: "A spicy twist on the classic pepperoni pizza",
          emoji: "🍕",
          likes: 12,
          views: 45,
          price: 850
        },
        {
          id: "2",
          name: "Veggie Delight",
          size: "Medium",
          crust: "Thick",
          toppings: ["Bell Peppers", "Olives", "Onions", "Tomatoes"],
          sauce: ["Tomato", "Pesto"],
          description: "Fresh and healthy vegetable pizza",
          emoji: "🥦",
          likes: 8,
          views: 32,
          price: 750
        },
        {
          id: "3",
          name: "BBQ Chicken",
          size: "Large",
          crust: "Regular",
          toppings: ["Chicken", "Red Onions", "Cilantro"],
          sauce: ["BBQ"],
          description: "Smoky BBQ flavor with tender chicken pieces",
          emoji: "🍗",
          likes: 15,
          views: 52,
          price: 900
        }
      ]
    };

    // Check if user is the owner or a viewer
    let isOwner = true;
    let isSelectionMode = false;
    let selectedPizzas = [];

    // Get DOM elements
    const userPizzasGrid = document.getElementById('userPizzasGrid');
    const modalsRoot = document.getElementById('modalsRoot');
    const viewOnlyIndicator = document.getElementById('viewOnlyIndicator');
    const selectionModeUI = document.getElementById('selectionModeUI');
    const shareMultipleBtnContainer = document.getElementById('shareMultipleBtnContainer');
    const shareMultipleBtn = document.getElementById('shareMultipleBtn');
    const shareSelectedBtn = document.getElementById('shareSelectedBtn');
    const cancelSelectionBtn = document.getElementById('cancelSelectionBtn');

    // Check URL parameters to determine if this is a shared view
    function checkViewMode() {
      const urlParams = new URLSearchParams(window.location.search);
      const shared = urlParams.get('shared');
      
      if (shared === 'true') {
        isOwner = false;
        viewOnlyIndicator.style.display = 'block';
        shareMultipleBtnContainer.style.display = 'none';
        
        // Try to load shared pizza data from URL
        const pizzasData = urlParams.get('pizzas');
        if (pizzasData) {
          try {
            const sharedPizzas = JSON.parse(decodeURIComponent(pizzasData));
            userProfile.pizzas = sharedPizzas;
          } catch (e) {
            console.error('Error parsing shared pizza data:', e);
          }
        }
      } else {
        // Load from localStorage for owner
        const saved = localStorage.getItem('userProfile');
        if (saved) {
          userProfile = JSON.parse(saved);
        }
      }
    }

    // Toggle selection mode
    function toggleSelectionMode() {
      isSelectionMode = !isSelectionMode;
      
      if (isSelectionMode) {
        selectionModeUI.style.display = 'block';
        userPizzasGrid.classList.add('selection-mode');
        shareMultipleBtnContainer.style.display = 'none';
        selectedPizzas = [];
      } else {
        selectionModeUI.style.display = 'none';
        userPizzasGrid.classList.remove('selection-mode');
        shareMultipleBtnContainer.style.display = 'block';
        
        // Clear selections
        const cards = document.querySelectorAll('.pizza-card');
        cards.forEach(card => {
          card.classList.remove('selected');
        });
      }
    }

    // Toggle pizza selection
    function togglePizzaSelection(pizzaId) {
      if (!isSelectionMode) return;
      
      const index = selectedPizzas.indexOf(pizzaId);
      const card = document.querySelector(`.pizza-card[data-pizza-id="${pizzaId}"]`);
      
      if (index === -1) {
        selectedPizzas.push(pizzaId);
        card.classList.add('selected');
      } else {
        selectedPizzas.splice(index, 1);
        card.classList.remove('selected');
      }
    }

    // Share selected pizzas
    function shareSelectedPizzas() {
      if (selectedPizzas.length === 0) {
        alert("Please select at least one pizza to share.");
        return;
      }
      
      const selectedPizzaData = userProfile.pizzas.filter(pizza => 
        selectedPizzas.includes(pizza.id)
      );
      
      const pizzasData = encodeURIComponent(JSON.stringify(selectedPizzaData));
      const shareUrl = `${window.location.origin}${window.location.pathname}?shared=true&pizzas=${pizzasData}`;
      const shareText = `Check out my pizza creations! I've shared ${selectedPizzaData.length} pizza${selectedPizzaData.length > 1 ? 's' : ''} with you.`;
      
      if (navigator.share) {
        navigator.share({
          title: 'My Pizza Creations',
          text: shareText,
          url: shareUrl
        }).then(() => {
          toggleSelectionMode();
        });
      } else {
        // Fallback for browsers that don't support Web Share API
        navigator.clipboard.writeText(shareText + "\n\n" + shareUrl).then(() => {
          alert("Share link copied to clipboard!");
          toggleSelectionMode();
        }).catch(() => {
          alert(`Share these pizzas:\n\n${shareText}\n\n${shareUrl}`);
          toggleSelectionMode();
        });
      }
    }

    //Download pizza card
    function downloadCard(pizzaId) {
      const action = document.querySelector('.modal-actions');
      action.style.display = 'none';

      html2canvas(document.getElementById('pizzaModal')).then(canvas => {
        const link = document.createElement('a');
        link.download = "pizzaModal.png";
        link.href = canvas.toDataURL('image/png');
        link.click();
        action.style.display = 'flex';
      });
    }

    // Load user profile
    function loadUserProfile() {
      updateProfileDisplay();
    }

    // Save user profile (only for owner)
    function saveUserProfile() {
      if (isOwner) {
        localStorage.setItem('userProfile', JSON.stringify(userProfile));
      }
      updateProfileDisplay();
    }

    // Update profile display
    function updateProfileDisplay() {
      renderUserPizzas();
    }

    // Render user pizzas
    function renderUserPizzas() {
      userPizzasGrid.innerHTML = '';
      
      if (userProfile.pizzas.length === 0) {
        userPizzasGrid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #d6d6d6; padding: 40px 20px; font-size: 1.1rem;">No pizzas created yet! <br><a href="custom.html" style="color: #ff5a2e; text-decoration: none; font-weight: 700;">Create your first pizza →</a></p>';
        shareMultipleBtnContainer.style.display = 'none';
        return;
      }
      
      for (let i = 0; i < userProfile.pizzas.length; i++) {
        const pizza = userProfile.pizzas[i];
        const card = document.createElement('div');
        card.className = 'pizza-card';
        card.dataset.pizzaId = pizza.id;
        card.innerHTML = `
          <div class="selection-checkbox"></div>
          <div class="pizza-emoji">${pizza.emoji || '🍕'}</div>
          <div class="pizza-name">${pizza.name}</div>
          <button class="pizza-share-btn" onclick="event.stopPropagation(); sharePizza('${pizza.id}')">
            <i class="fas fa-share-alt"></i> Share
          </button>
        `;
        
        // Add click event to open modal or select pizza
        card.addEventListener('click', function() {
          if (isSelectionMode) {
            togglePizzaSelection(pizza.id);
          } else {
            openPizzaModal(pizza.id);
          }
        });
        
        userPizzasGrid.appendChild(card);
      }
    }

    // Open Instagram-style modal for pizza
    function openPizzaModal(pizzaId) {
      const pizza = userProfile.pizzas.find(p => p.id === pizzaId);
      if (!pizza) return;
      
      // Determine which buttons to show based on user type
      const actionButtons = isOwner ? 
        `
          <button class="modal-action-btn" onclick="likePizza('${pizza.id}'); closePizzaModal();">Like</button>
          <button class="modal-action-btn" onclick="sharePizza('${pizza.id}');">Share</button>
          <button class="modal-action-btn download" onclick="downloadCard('${pizza.id}');">Download</button>
          <button class="modal-action-btn primary" onclick="orderPizza('${pizza.id}');">Order Now</button>
          <button class="modal-action-btn delete" onclick="deletePizzaInModal('${pizza.id}');">Delete</button>
        ` :
        `
          <button class="modal-action-btn" onclick="viewerLikePizza('${pizza.id}');">Like</button>
          <button class="modal-action-btn" onclick="sharePizza('${pizza.id}');">Share</button>
          <button class="modal-action-btn download" onclick="downloadCard('${pizza.id}');">Download</button>
          <button class="modal-action-btn primary" onclick="viewerOrderPizza('${pizza.id}');">Order Now</button>
        `;
      
      // Create modal HTML
      const modalHTML = `
        <div class="modal-backdrop" id="pizzaModal">
          <div class="instagram-modal">
            <div class="modal-image-section">
              <div class="modal-image-content">${pizza.emoji || '🍕'}</div>
            </div>
            <div class="modal-details-section">
              <div class="modal-header">
                <div class="modal-avatar">${userProfile.username[0] || "🍕"}</div>
                <div class="modal-username">${isOwner ? 'My Pizza Creations' : 'Shared Pizza'}</div>
                <button class="modal-close" id="modalClose">&times;</button>
              </div>
              <div class="modal-content">
                <div class="modal-pizza-name">${pizza.name}</div>
                <div class="modal-pizza-details">
                  <div class="modal-pizza-detail"><strong>Size:</strong> ${pizza.size}</div>
                  <div class="modal-pizza-detail"><strong>Crust:</strong> ${pizza.crust}</div>
                  <div class="modal-pizza-detail"><strong>Toppings:</strong> ${pizza.toppings.join(', ')}</div>
                  <div class="modal-pizza-detail"><strong>Sauce:</strong> ${pizza.sauce.join(', ')}</div>
                </div>
                <div class="modal-pizza-description">${pizza.description}</div>
                <div class="modal-pizza-stats">
                  <div class="modal-stat">
                    <div class="modal-stat-value">${pizza.likes || 0}</div>
                    <div class="modal-stat-label">Likes</div>
                  </div>
                  <div class="modal-stat">
                    <div class="modal-stat-value">${pizza.views || 0}</div>
                    <div class="modal-stat-label">Views</div>
                  </div>
                  <div class="modal-stat">
                    <div class="modal-stat-value">Rs.${pizza.price || 0}</div>
                    <div class="modal-stat-label">Price</div>
                  </div>
                </div>
              </div>
              <div class="modal-actions">
                ${actionButtons}
              </div>
            </div>
          </div>
        </div>
      `;
      
      // Add modal to page
      modalsRoot.innerHTML = modalHTML;
      
      // Show modal with animation
      setTimeout(() => {
        const modal = document.getElementById('pizzaModal');
        modal.classList.add('active');
      }, 10);
      
      // Add event listener for closing modal
      document.getElementById('modalClose').addEventListener('click', closePizzaModal);
      
      // Close modal when clicking on backdrop
      document.getElementById('pizzaModal').addEventListener('click', function(e) {
        if (e.target === this) {
          closePizzaModal();
        }
      });
      
      // Close modal with Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closePizzaModal();
        }
      });
    }

    // Close pizza modal
    function closePizzaModal() {
      const modal = document.getElementById('pizzaModal');
      if (modal) {
        modal.classList.remove('active');
        setTimeout(() => {
          modalsRoot.innerHTML = '';
        }, 300);
      }
    }

    // Like a pizza (owner only)
    function likePizza(pizzaId) {
      if (!isOwner) return;
      
      const pizza = userProfile.pizzas.find(p => p.id === pizzaId);
      if (pizza) {
        pizza.likes = (pizza.likes || 0) + 1;
        saveUserProfile();
      }
    }

    // Like a pizza (viewer - doesn't save)
    function viewerLikePizza(pizzaId) {
      alert("Thanks for liking this pizza! The owner will be notified.");
      // In a real app, you would send this to a server
    }

    // Share a single pizza
    function sharePizza(pizzaId) {
      const pizza = userProfile.pizzas.find(p => p.id === pizzaId);
      if (pizza) {
        const pizzaData = encodeURIComponent(JSON.stringify(pizza));
        const shareUrl = `${window.location.origin}${window.location.pathname}?shared=true&pizzas=${pizzaData}`;
        const shareText = `Check out this pizza creation: ${pizza.name}! ${pizza.size} pizza with ${pizza.crust} crust and ${pizza.toppings.join(', ')} toppings.`;
        
        if (navigator.share) {
          navigator.share({
            title: pizza.name,
            text: shareText,
            url: shareUrl
          });
        } else {
          // Fallback for browsers that don't support Web Share API
          navigator.clipboard.writeText(shareText + "\n\n" + shareUrl).then(() => {
            alert("Pizza details and share link copied to clipboard!");
          }).catch(() => {
            alert(`Share this pizza:\n\n${shareText}\n\n${shareUrl}`);
          });
        }
      }
    }

    // Order a pizza (owner only)
    function orderPizza(pizzaId) {
      if (!isOwner) return;
      
      const pizza = userProfile.pizzas.find(p => p.id === pizzaId);
      if (pizza) {
        alert(`Order placed for ${pizza.name}! Total: Rs.${pizza.price}`);
        closePizzaModal();
      }
    }

    // Order a pizza (viewer - redirects to order page)
    function viewerOrderPizza(pizzaId) {
      const pizza = userProfile.pizzas.find(p => p.id === pizzaId);
      if (pizza) {
        alert(`Redirecting to order page for ${pizza.name}!`);
        // In a real app, you would redirect to an order page with the pizza details
        // window.location.href = `order.html?pizza=${pizzaId}`;
      }
    }

    // Delete a pizza from modal (owner only)
    function deletePizzaInModal(pizzaId) {
      if (!isOwner) return;
      
      if (confirm("Are you sure you want to delete this pizza? This action cannot be undone.")) {
        userProfile.pizzas = userProfile.pizzas.filter(p => p.id !== pizzaId);
        saveUserProfile();
        closePizzaModal();
      }
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
      // Check if user is owner or viewer
      checkViewMode();
      
      // Load user profile
      loadUserProfile();
      
      // Set up event listeners for selection mode
      if (isOwner) {
        shareMultipleBtn.addEventListener('click', toggleSelectionMode);
        shareSelectedBtn.addEventListener('click', shareSelectedPizzas);
        cancelSelectionBtn.addEventListener('click', toggleSelectionMode);
      } else {
        shareMultipleBtnContainer.style.display = 'none';
      }
    });

    // Make functions global for onclick handlers
    window.likePizza = likePizza;
    window.viewerLikePizza = viewerLikePizza;
    window.sharePizza = sharePizza;
    window.orderPizza = orderPizza;
    window.viewerOrderPizza = viewerOrderPizza;
    window.deletePizzaInModal = deletePizzaInModal;
    window.openPizzaModal = openPizzaModal;
    window.closePizzaModal = closePizzaModal;
    window.downloadCard = downloadCard;
    window.togglePizzaSelection = togglePizzaSelection;
  </script>
</body>
</html>
